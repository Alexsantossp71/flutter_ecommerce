# CI para flutter_ecommerce — Moda Praia Santos
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Static analysis (fails only on errors)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test/ folder — skipping tests"
          fi
