name: Debug Assets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Estado do checkout (imagens)
        run: |
          echo "=== images/ no checkout ==="
          find images -type f -exec ls -la {} \; 2>&1
          echo ""
          echo "=== pubspec.yaml ==="
          cat pubspec.yaml
      - name: Build
        run: flutter pub get && flutter build web --release --base-href=/flutter_ecommerce/
      - name: Inspecionar resultado
        run: |
          echo "=== build/web/assets/ (completo) ==="
          find build/web/assets -type f 2>&1
          echo ""
          echo "=== AssetManifest.bin.json (completo) ==="
          cat build/web/assets/AssetManifest.bin.json
          echo ""
          echo "=== Tamanho do build ==="
          du -sh build/web
