name: Debug Assets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href=/flutter_ecommerce/
      - name: Inspecionar resultado
        run: |
          echo "=== build/web/assets/images/ ==="
          find build/web/assets/images -type f 2>&1
          echo "=== AssetManifest.bin.json ==="
          cat build/web/assets/AssetManifest.bin.json 2>/dev/null | head -c 500
          echo ""
          echo "=== pubspec.yaml tamanho ==="
          wc -c pubspec.yaml
          echo "=== sha256 dos products ==="
          sha256sum images/products/camiseta-mar.jpg images/products/tenis-casual.jpg
