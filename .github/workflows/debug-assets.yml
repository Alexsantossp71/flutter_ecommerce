name: Debug Assets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ver estado do repo
        run: |
          echo "=== PWD ==="; pwd
          echo "=== images/ ==="; ls -la images/ 2>&1
          echo "=== images/products/ ==="; ls -la images/products/ 2>&1
          echo "=== pubspec (flutter section) ==="; sed -n '/^flutter:/,$p' pubspec.yaml
          echo "=== git log ==="; git log -1 --format='%H %s'
